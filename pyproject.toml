[project]
name = "re-anomaly"
version = "0.1.0"
description = "Next-generation SMT Anomaly Detection System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "transformers>=4.30.0",
    "pillow>=9.0.0",
    "numpy<2.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "faiss-cpu>=1.7.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.65.0",
    "tensorboard>=2.13.0",
    "matplotlib>=3.7.0",
    "gdown>=5.2.0",
    "positional-encodings>=6.0.3",
    "imgaug>=0.4.0",
    "pandas>=2.3.3",
    "wandb>=0.15.0",
    "einops>=0.8.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]
