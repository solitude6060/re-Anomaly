triton:
  server_url: localhost:8001
  model_name: re_anomaly
  model_version: "1"

onnx:
  opset_version: 17
  dynamic_axes:
    input: {0: batch_size}
    output: {0: batch_size}
  simplify: true

optimization:
  fp16: true
  tensorrt: true
  max_batch_size: 32

inference:
  timeout_ms: 100
  max_queue_delay_ms: 50
