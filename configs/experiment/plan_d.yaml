defaults:
  - /backbone: pixio
  - /head: msflow
  - /augmentation: train
  - /dataset: smt
  - /training: default
  - /evaluation: default

experiment_name: plan_d_msflow_multiscale

backbone:
  variant: pixio_vith14
  freeze_backbone: true

head:
  flow:
    type: realnvp
    num_blocks: 8
  scales:
    - name: low
      input_layer: 0
      spatial_size: 56
    - name: mid
      input_layer: 1
      spatial_size: 28
    - name: high
      input_layer: 2
      spatial_size: 14
  anomaly_score:
    scale_weights: [0.2, 0.3, 0.5]

training:
  epochs: 100
  learning_rate: 1e-4
