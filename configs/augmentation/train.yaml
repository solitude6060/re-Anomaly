name: train

image_size: 224

transforms:
  - type: Resize
    size: [256, 256]
  - type: RandomCrop
    size: [224, 224]
  - type: RandomHorizontalFlip
    p: 0.5
  - type: RandomVerticalFlip
    p: 0.5
  - type: RandomRotation
    degrees: 15
  - type: ColorJitter
    brightness: 0.1
    contrast: 0.1
    saturation: 0.1
    hue: 0.05
  - type: ToTensor
  - type: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

compression_simulation:
  enabled: true
  quality_range: [70, 95]
  probability: 0.3
