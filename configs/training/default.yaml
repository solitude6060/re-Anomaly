batch_size: 32
epochs: 100
learning_rate: 1e-4

optimizer:
  type: adamw
  weight_decay: 1e-5
  betas: [0.9, 0.999]

scheduler:
  type: cosine
  warmup_epochs: 5
  min_lr: 1e-6

early_stopping:
  enabled: true
  patience: 10
  metric: val_auroc
  mode: max

gradient_clipping:
  enabled: true
  max_norm: 1.0

checkpoint:
  save_best: true
  save_last: true
  metric: val_auroc
