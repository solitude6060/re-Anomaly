# re-Anomaly Main Configuration
# This is the entry point for Hydra configuration

defaults:
  - backbone: dinov2
  - head: patchcore
  - augmentation: train
  - dataset: mvtec
  - training: default
  - evaluation: default
  - _self_

# Project settings
project:
  name: re-anomaly
  version: "0.1.0"
  seed: 42
  deterministic: true

# Output settings
output:
  root_dir: outputs
  experiment_name: ${backbone.name}_${head.name}
  save_checkpoints: true
  checkpoint_interval: 5
  log_interval: 100

# Device settings
device:
  accelerator: auto  # auto, cpu, gpu, tpu
  devices: 1
  precision: 32  # 16, 32, bf16

# Hydra settings
hydra:
  run:
    dir: ${output.root_dir}/${output.experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output.root_dir}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
