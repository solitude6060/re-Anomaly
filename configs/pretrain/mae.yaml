mae:
  masking_ratio: 0.75
  decoder_depth: 8
  decoder_dim: 512
  decoder_heads: 16

training:
  batch_size: 256
  epochs: 800
  learning_rate: 1.5e-4
  warmup_epochs: 40
  min_lr: 1e-6

optimizer:
  type: adamw
  weight_decay: 0.05
  betas: [0.9, 0.95]

data:
  root_path: data/smt_pretrain
  image_size: 224
  num_workers: 16

checkpoint:
  save_interval: 50
  output_dir: pretrained/mae
